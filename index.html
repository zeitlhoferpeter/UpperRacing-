<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090909">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UpperRacing">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>UpperRacing - Trackday App</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#090909;overflow:hidden}
    #previewFrame{display:block;width:100%;height:100%;border:0;background:#121212}
    #pullRefresh{position:fixed;left:50%;top:9px;z-index:99999;transform:translate(-50%,-56px);background:#181818;border:1px solid #3d3d3d;border-radius:18px;color:#ddd;font:800 11px system-ui;padding:8px 13px;opacity:0;transition:transform .16s ease,opacity .16s ease;pointer-events:none;box-shadow:0 5px 18px rgba(0,0,0,.35)}
    #pullRefresh.show{opacity:1;transform:translate(-50%,0)}
    #pullRefresh.ready{color:#ffd400;border-color:#756300}
  </style>
</head>
<body>
  <div id="pullRefresh">↓ Zum Aktualisieren ziehen</div>
  <iframe id="previewFrame" title="UpperRacing"></iframe>
  <script>
    (function(){
      const frame=document.getElementById('previewFrame');
      const indicator=document.getElementById('pullRefresh');
      const build=Date.now().toString();

      function installPullRefresh(){
        const w=frame.contentWindow,d=frame.contentDocument;
        if(!w||!d||d.__upperPullRefreshInstalled)return;
        d.__upperPullRefreshInstalled=true;
        let startY=0,dy=0,tracking=false;
        const scrollTop=()=>Math.max(0,(d.scrollingElement&&d.scrollingElement.scrollTop)||d.documentElement.scrollTop||d.body.scrollTop||0);
        d.addEventListener('touchstart',function(e){
          const t=e.target;
          if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"]'))return;
          if(scrollTop()>1)return;
          tracking=true;dy=0;startY=e.touches[0].clientY;
        },{passive:true});
        d.addEventListener('touchmove',function(e){
          if(!tracking)return;
          dy=e.touches[0].clientY-startY;
          if(dy<=8||scrollTop()>1){indicator.classList.remove('show','ready');return}
          indicator.classList.add('show');
          if(dy>=85){indicator.classList.add('ready');indicator.textContent='↻ Loslassen zum Aktualisieren'}
          else{indicator.classList.remove('ready');indicator.textContent='↓ Zum Aktualisieren ziehen'}
        },{passive:true});
        d.addEventListener('touchend',function(){
          if(!tracking)return;
          const reload=dy>=85&&scrollTop()<=1;
          tracking=false;dy=0;
          indicator.classList.remove('show','ready');
          if(reload){indicator.textContent='↻ Aktualisiere …';indicator.classList.add('show','ready');setTimeout(()=>location.reload(),80)}
        },{passive:true});
      }

      frame.addEventListener('load',installPullRefresh);

      fetch('app-base.html?main='+build,{cache:'no-store'})
        .then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.text();})
        .then(function(html){
          html=html.replace('<head>','<head><base href="/UpperRacing-/">');
          html=html.replace(/(src|href)="(?!https?:|\/\/|data:|#)([^"]+)"/g,function(match,attr,url){
            const sep=url.indexOf('?')>=0?'&':'?';
            return attr+'="'+url+sep+'main='+build+'"';
          });
          frame.srcdoc=html;
        })
        .catch(function(err){
          console.warn('[UpperRacing] Frischer App-Load fehlgeschlagen, Fallback:',err);
          frame.src='app-base.html?main='+build;
        });

      if('serviceWorker' in navigator){
        window.addEventListener('load',function(){
          navigator.serviceWorker.register('./sw.js').then(function(reg){reg.update().catch(()=>{})}).catch(function(err){console.log('Service Worker Fehler:',err)});
        });
      }
    })();
  </script>

  <!-- Getestete produktive Erweiterungen aus dem bisherigen Preview-Stand -->
  <script src="preview/proxy.js?v=20260816-main2"></script>
  <script src="preview/preview.js?v=20260816-main2"></script>
  <script src="preview/parser-prefilter.js?v=20260816-main2"></script>
  <script src="preview/parser-turn-gap-fix.js?v=20260816-main2"></script>
  <script src="preview/parser-v4.js?v=20260816-main2"></script>
  <script src="preview/stardesign-finder.js?v=20260816-main2"></script>
  <script src="preview/schedule-mobile-ui.js?v=20260816-main2"></script>
  <script src="preview/day-rollover.js?v=20260816-main2"></script>
  <script src="preview/header-program-context.js?v=20260816-main2"></script>

  <!-- weather-warning-test.js ist absichtlich NICHT in der Main-App -->
</body>
</html>
