<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpperRacing Setup & Laps</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; }
        .page-content { display: none; }
        .page-content.active { display: block; }
        .setup-box { background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        input, select, textarea { width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; margin-top: 4px; }
        button { cursor: pointer; padding: 8px 12px; border: none; border-radius: 4px; font-weight: bold; }
        .tab-bar { display: flex; gap: 5px; margin-bottom: 15px; background: #181818; padding: 5px; border-radius: 6px; }
        .tab-btn { flex: 1; background: #2c2c2c; color: #aaa; padding: 10px; text-align: center; border-radius: 4px; cursor: pointer; }
        .tab-btn.active { background: #4CAF50; color: #fff; }
        .notice { display: none; background: #4CAF50; color: white; padding: 6px; text-align: center; border-radius: 4px; margin-bottom: 10px; font-size: 0.85rem; }
        .btn-status { background: transparent; border: 1px solid #444; font-size: 1.1rem; padding: 4px 8px; border-radius: 4px; }
        .active-red { background: rgba(244, 67, 54, 0.3); border-color: #f44336; }
        .active-yellow { background: rgba(255, 193, 7, 0.3); border-color: #ffc107; }
        .active-green { background: rgba(76, 175, 80, 0.3); border-color: #4CAF50; }
        #imageModal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); text-align: center; }
        #imageModal img { max-width: 90%; max-height: 90%; margin-top: 5vh; }
    </style>
</head>
<body onload="initApp()">

    <!-- Header / Navigation -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2 style="margin:0; font-size:1.2rem;">UpperRacing</h2>
        <div style="font-size:0.8rem; color:#aaa;">Bestzeit: <span id="headerAllTimeValue" style="color:#4CAF50; font-weight:bold;">--:--.---</span></div>
    </div>

    <!-- Streckenauswahl -->
    <div class="setup-box">
        <label style="font-size:0.8rem;">Strecke:</label>
        <select id="trackSelect" onchange="onTrackChange()">
            <option value="pannoniaring">Pannoniaring</option>
            <option value="slovakia">Slovakiaring</option>
            <option value="brünn">Automotodrom Brno / Brünn</option>
            <option value="most">Autodrom Most</option>
            <option value="grobnik">Automotodrom Grobnik / Rijeka</option>
        </select>
    </div>

    <!-- Navigation Tabs -->
    <div class="tab-bar">
        <div class="tab-btn active" onclick="switchPage('setup')">Setup</div>
        <div class="tab-btn" onclick="switchPage('curves')">Kurven</div>
        <div class="tab-btn" onclick="switchPage('laps')">Runden</div>
        <div class="tab-btn" onclick="switchPage('cup')">Cup</div>
    </div>

    <div id="saveNotice" class="notice"></div>

    <!-- PAGE: SETUP -->
    <div id="pageSetup" class="page-content active">
        <div class="setup-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <label style="font-size:0.8rem; font-weight:bold;">Session / Eintrag:</label>
                <button type="button" onclick="newSession()" style="background:#2196F3; color:#fff; font-size:0.75rem; padding:4px 8px;">+ Neuer Eintrag</button>
            </div>
            <select id="sessionSelect" onchange="onSessionChange()"></select>
        </div>

        <div class="setup-box">
            <h3>Reifen & Allgemein</h3>
            <div class="grid-2">
                <div><label style="font-size:0.75rem;">Reifen Vorne</label><input type="text" id="tireFront" placeholder="z.B. Pirelli SC1"></div>
                <div><label style="font-size:0.75rem;">Reifen Hinten</label><input type="text" id="tireRear" placeholder="z.B. Pirelli SC2"></div>
            </div>
            <div class="grid-2" style="margin-top:8px;">
                <div><label style="font-size:0.75rem;">Lufttemperatur (°C)</label><input type="text" id="outsideTemp" placeholder="z.B. 25"></div>
                <div><label style="font-size:0.75rem;">Übersetzung</label><input type="text" id="gearing" placeholder="z.B. 15/42"></div>
            </div>

            <div style="margin-top:10px;">
                <label style="font-size:0.75rem;">Reifenbilder / Zustand:</label>
                <input type="file" accept="image/*" multiple onchange="handleImageUpload(event)" style="margin-top:4px;">
                <div id="tireImageContainer" style="margin-top:8px; display:none;"></div>
            </div>
        </div>

        <div class="setup-box">
            <h3>Gabel (Front)</h3>
            <div class="grid-2">
                <div><label style="font-size:0.75rem;">Zugstufe (Rebound)</label><input type="text" id="forkRebound" placeholder="Klicks offen"></div>
                <div><label style="font-size:0.75rem;">Druckstufe (Comp)</label><input type="text" id="forkCompression" placeholder="Klicks offen"></div>
            </div>
            <div class="grid-2" style="margin-top:8px;">
                <div><label style="font-size:0.75rem;">Vorspannung</label><input type="text" id="forkPreload" placeholder="Ringe / mm"></div>
                <div><label style="font-size:0.75rem;">Negativfederweg (Sag)</label><input type="text" id="forkSag" placeholder="mm"></div>
            </div>
            <div style="margin-top:8px;">
                <label style="font-size:0.75rem;">Restfederweg</label><input type="text" id="forkRemaining" placeholder="mm">
            </div>
        </div>

        <div class="setup-box">
            <h3>Federbein (Rear)</h3>
            <div class="grid-2">
                <div><label style="font-size:0.75rem;">Zugstufe (Rebound)</label><input type="text" id="shockRebound" placeholder="Klicks offen"></div>
                <div><label style="font-size:0.75rem;">Druckstufe (Comp)</label><input type="text" id="shockCompression" placeholder="Klicks offen"></div>
            </div>
            <div class="grid-2" style="margin-top:8px;">
                <div><label style="font-size:0.75rem;">Vorspannung</label><input type="text" id="shockPreload" placeholder="mm"></div>
                <div><label style="font-size:0.75rem;">Negativfederweg (Sag)</label><input type="text" id="shockSag" placeholder="mm"></div>
            </div>
            <div style="margin-top:8px;">
                <label style="font-size:0.75rem;">Restfederweg</label><input type="text" id="shockRemaining" placeholder="mm">
            </div>
        </div>

        <div style="display:flex; gap:8px; margin-bottom:20px;">
            <button type="button" onclick="saveData()" style="flex:2; background:#4CAF50; color:#fff; padding:12px;">Speichern</button>
            <button type="button" onclick="saveBaseline()" style="flex:1; background:#FF9800; color:#fff; padding:12px; font-size:0.8rem;">Als Basis</button>
            <button type="button" onclick="loadBaseline()" style="flex:1; background:#607D8B; color:#fff; padding:12px; font-size:0.8rem;">Basis laden</button>
        </div>
        <div style="text-align:center; margin-bottom:20px;">
            <button type="button" onclick="deleteCurrentSession()" style="background:#f44336; color:#fff; font-size:0.8rem; padding:6px 12px;">Diesen Eintrag löschen</button>
        </div>
    </div>

    <!-- PAGE: CURVES -->
    <div id="pageCurves" class="page-content">
        <div class="setup-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="margin:0;">Kurven-Guide</h3>
                <div>
                    <button type="button" onclick="saveCurvesData()" style="background:#4CAF50; color:#fff; font-size:0.75rem; padding:6px 10px;">Speichern</button>
                    <button type="button" onclick="shareCurves()" style="background:#2196F3; color:#fff; font-size:0.75rem; padding:6px 10px;">Teilen</button>
                </div>
            </div>
            <div id="saveNoticeCurves" class="notice"></div>
            <div id="curvesContainer"></div>
        </div>
    </div>

    <!-- PAGE: LAPS -->
    <div id="pageLaps" class="page-content">
        <div class="setup-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <label style="font-size:0.8rem; font-weight:bold;">Stint:</label>
                <div>
                    <button type="button" onclick="startNewLapSession()" style="background:#2196F3; color:#fff; font-size:0.75rem; padding:4px 8px;">+ Neuer Stint</button>
                    <button type="button" onclick="deleteCurrentLapSession()" style="background:#f44336; color:#fff; font-size:0.75rem; padding:4px 8px;">Löschen</button>
                </div>
            </div>
            <select id="lapSessionSelect" onchange="onLapSessionChange()"></select>
        </div>

        <div class="setup-box">
            <h3>Runde hinzufügen</h3>
            <div class="grid-2">
                <div><label style="font-size:0.75rem;">Minuten</label><input type="number" id="manualMin" placeholder="0"></div>
                <div><label style="font-size:0.75rem;">Sekunden</label><input type="number" id="manualSec" placeholder="35"></div>
            </div>
            <div class="grid-2" style="margin-top:8px;">
                <div><label style="font-size:0.75rem;">Millisekunden</label><input type="number" id="manualMs" placeholder="123"></div>
                <div><label style="font-size:0.75rem;">Runden-Nr. (opt.)</label><input type="number" id="manualLapNum" placeholder="1"></div>
            </div>
            <button type="button" onclick="addManualLap()" style="width:100%; background:#4CAF50; color:#fff; margin-top:10px; padding:10px;">Runde eintragen</button>
        </div>

        <div class="setup-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <h3 style="margin:0;">Rundenliste</h3>
                <button type="button" onclick="confirmClearLaps()" style="background:#f44336; color:#fff; font-size:0.75rem; padding:4px 8px;">Stint leeren</button>
            </div>
            <div id="lapsContainer"></div>
            <div style="margin-top:15px; border-top:1px solid #333; padding-top:10px; text-align:center;">
                <button type="button" onclick="confirmClearAllTimeBest()" style="background:#b71c1c; color:#fff; font-size:0.75rem; padding:6px 12px;">All-Time Bestzeit zurücksetzen</button>
            </div>
        </div>
    </div>

    <!-- PAGE: CUP -->
    <div id="pageCup" class="page-content">
        <div class="setup-box">
            <h3>Cup / Reglement & Link</h3>
            <label style="font-size:0.75rem;">PDF / Web-Link:</label>
            <input type="text" id="cupUrlInput" placeholder="https://...">
            <div style="display:flex; gap:8px; margin-top:10px;">
                <button type="button" onclick="saveCupUrl()" style="flex:1; background:#4CAF50; color:#fff; padding:10px;">Link speichern</button>
                <button type="button" onclick="openCupInBrowser()" style="flex:1; background:#2196F3; color:#fff; padding:10px;">Öffnen</button>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" onclick="closeModal()">
        <img id="modalImg" src="">
    </div>

    <script src="app.js"></script>
</body>
</html>
