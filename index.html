<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpperRacing App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header Zone mit Ausrichtungs-Garantie -->
        <header class="app-header">
            <div class="header-left">
                <h1 class="brand-title">Upper<span class="accent-text">Racing</span></h1>
                <div class="track-selector-wrapper">
                    <select id="trackSelect" onchange="onTrackChange()">
                        <option value="pannoniaring">Pannonia</option>
                        <option value="slovakia">Slovakia</option>
                        <option value="brünn">Brünn</option>
                        <option value="most">Most</option>
                        <option value="grobnik">Grobnik</option>
                    </select>
                </div>
                <div class="moto-selector-wrapper">
                    <select id="motorcycleSelect" onchange="onMotorcycleChange()"></select>
                </div>
            </div>

            <div class="header-widgets">
                <!-- Bestzeit Badge -->
                <div class="racing-badge badge-besttime" onclick="confirmClearAllTimeBest()" title="Klicken zum Löschen">
                    <span class="badge-label">BESTZEIT</span>
                    <span class="badge-value tabular-nums" id="headerAllTimeValue">--:--.---</span>
                </div>

                <!-- Live Schedule / Turn Badge -->
                <div class="racing-badge badge-schedule" id="headerScheduleBadge" onclick="switchPage('schedule')" title="Zum Zeitplan">
                    <span class="badge-label" id="currentGroupLabel">TURN --</span>
                    <span class="badge-value tabular-nums" id="currentTurnCountdown">--:--</span>
                </div>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="nav-tabs">
            <button type="button" class="tab-btn active" onclick="switchPage('setup')">⚙️ Setup</button>
            <button type="button" class="tab-btn" onclick="switchPage('curves')">🏁 Kurven</button>
            <button type="button" class="tab-btn" onclick="switchPage('laps')">⏱️ Runden</button>
            <button type="button" class="tab-btn" onclick="switchPage('schedule')">📅 Zeitplan</button>
            <button type="button" class="tab-btn" onclick="switchPage('cup')">🏆 Cup</button>
        </nav>

        <!-- Main Content Area -->
        <main>
            <div id="saveNotice" class="save-notice" style="display:none;"></div>

            <!-- Page: Setup -->
            <section id="pageSetup" class="page-content active">
                <div class="setup-box">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <h3>Eintrag wählen / anlegen</h3>
                        <button type="button" onclick="startNewSessionForm()" style="background:#4CAF50; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:0.75rem; cursor:pointer;">+ Neu</button>
                    </div>
                    <select id="sessionSelect" style="margin-bottom:8px;"></select>
                    <div style="display:flex; gap:6px;">
                        <button type="button" onclick="saveData()" style="flex:1; background:#2196F3; color:#fff; border:none; padding:6px; border-radius:4px; font-size:0.8rem; cursor:pointer;">Speichern</button>
                        <button type="button" onclick="deleteCurrentSession()" style="background:#f44336; color:#fff; border:none; padding:6px; border-radius:4px; font-size:0.8rem; cursor:pointer;">Löschen</button>
                    </div>
                </div>

                <div class="setup-box">
                    <h3>Allgemein</h3>
                    <div class="grid-2">
                        <div><label>Reifen Vorne</label><input type="text" id="tireFront"></div>
                        <div><label>Reifen Hinten</label><input type="text" id="tireRear"></div>
                        <div><label>Außentemp. (°C)</label><input type="text" id="outsideTemp"></div>
                        <div><label>Übersetzung</label><input type="text" id="gearing"></div>
                    </div>
                </div>

                <div class="setup-box">
                    <h3>Gabel (Vorne)</h3>
                    <div class="grid-2">
                        <div><label>Zugstufe (Rebound)</label><input type="text" id="forkRebound"></div>
                        <div><label>Druckstufe (Comp)</label><input type="text" id="forkCompression"></div>
                        <div><label>Vorspannung</label><input type="text" id="forkPreload"></div>
                        <div><label>SAG (Durchhang)</label><input type="text" id="forkSag"></div>
                        <div><label>Restfederweg (mm)</label><input type="text" id="forkRemaining"></div>
                    </div>
                </div>

                <div class="setup-box">
                    <h3>Federbein (Hinten)</h3>
                    <div class="grid-2">
                        <div><label>Zugstufe (Rebound)</label><input type="text" id="shockRebound"></div>
                        <div><label>Druckstufe (Comp)</label><input type="text" id="shockCompression"></div>
                        <div><label>Vorspannung</label><input type="text" id="shockPreload"></div>
                        <div><label>SAG (Durchhang)</label><input type="text" id="shockSag"></div>
                        <div><label>Restfederweg (mm)</label><input type="text" id="shockRemaining"></div>
                    </div>
                </div>

                <div style="display:flex; gap:8px; margin-bottom:20px;">
                    <button type="button" onclick="executeSaveBaseline()" style="flex:1; background:#ff9800; color:#fff; border:none; padding:8px; border-radius:4px; font-size:0.8rem; font-weight:bold; cursor:pointer;">Als Basis-Setup speichern</button>
                    <button type="button" onclick="loadBaseline()" style="flex:1; background:#607D8B; color:#fff; border:none; padding:8px; border-radius:4px; font-size:0.8rem; font-weight:bold; cursor:pointer;">Basis-Setup laden</button>
                </div>
            </section>

            <!-- Page: Kurven -->
            <section id="pageCurves" class="page-content" style="display:none;">
                <div id="saveNoticeCurves" class="save-notice" style="display:none;"></div>
                <div style="display:flex; gap:8px; margin-bottom:12px;">
                    <button type="button" onclick="saveCurvesData()" style="flex:1; background:#4CAF50; color:#fff; border:none; padding:8px; border-radius:4px; font-weight:bold; cursor:pointer;">💾 Kurven Speichern</button>
                    <button type="button" onclick="shareCurves()" style="background:#2196F3; color:#fff; border:none; padding:8px 12px; border-radius:4px; font-weight:bold; cursor:pointer;">Teilen 📤</button>
                </div>
                <div id="curvesContainer"></div>
            </section>

            <!-- Page: Rundenzeit-Logger -->
            <section id="pageLaps" class="page-content" style="display:none;">
                <div class="setup-box">
                    <h3>Stint / Session wählen</h3>
                    <select id="lapSessionSelect" style="margin-bottom:8px;"></select>
                    <div style="display:flex; gap:6px;">
                        <button type="button" onclick="startNewLapSession()" style="flex:1; background:#4CAF50; color:#fff; border:none; padding:6px; border-radius:4px; font-size:0.8rem; cursor:pointer;">+ Neuer Stint</button>
                        <button type="button" onclick="deleteCurrentLapSession()" style="background:#f44336; color:#fff; border:none; padding:6px; border-radius:4px; font-size:0.8rem; cursor:pointer;">Stint Löschen</button>
                    </div>
                </div>

                <div class="setup-box">
                    <h3>Rundenzeit manuell eintragen</h3>
                    <div style="display:flex; gap:6px; align-items:center; margin-bottom:8px;">
                        <input type="number" id="manualMin" placeholder="Min" style="width:60px; text-align:center;">
                        <span>:</span>
                        <input type="number" id="manualSec" placeholder="Sek" style="width:60px; text-align:center;">
                        <span>.</span>
                        <input type="number" id="manualMs" placeholder="Ms" style="width:70px; text-align:center;">
                    </div>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <input type="number" id="manualLapNum" placeholder="Runde Nr. (Optional)" style="flex:1;">
                        <button type="button" onclick="addManualLap()" style="background:#2196F3; color:#fff; border:none; padding:8px 12px; border-radius:4px; font-weight:bold; cursor:pointer;">+ Hinzufügen</button>
                    </div>
                </div>

                <div class="setup-box">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <h3>Zeiten Übersicht</h3>
                        <button type="button" onclick="confirmClearLaps()" style="background:none; border:none; color:#f44336; font-size:0.75rem; cursor:pointer;">Stint leeren</button>
                    </div>
                    <div id="lapsContainer"></div>
                </div>
            </section>

            <!-- Page: Live-Zeitplan (Schedule) -->
            <section id="pageSchedule" class="page-content" style="display:none;"></section>

            <!-- Page: Cup Link -->
            <section id="pageCup" class="page-content" style="display:none;">
                <div class="setup-box">
                    <h3>Cup PDF & Online Infos</h3>
                    <label>Cup PDF-URL hinterlegen:</label>
                    <input type="text" id="cupUrlInput" style="margin-bottom:8px;">
                    <div style="display:flex; gap:6px;">
                        <button type="button" onclick="saveCupUrl()" style="flex:1; background:#4CAF50; color:#fff; border:none; padding:8px; border-radius:4px; cursor:pointer;">URL Speichern</button>
                        <button type="button" onclick="openCupInBrowser()" style="flex:1; background:#2196F3; color:#fff; border:none; padding:8px; border-radius:4px; cursor:pointer;">Öffnen 🔗</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Skripte -->
    <script src="app.js"></script>
    <script src="schedule.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initApp === 'function') initApp();
        });
    </script>
</body>
</html>
