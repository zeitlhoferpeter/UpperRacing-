<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090909">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>UpperRacing Dashboard Test</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#090909;overflow:hidden}
    #previewFrame{display:block;width:100%;height:100%;border:0;background:#121212}
    #bootState{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090909;color:#aaa;font:600 14px system-ui;z-index:10}
  </style>
</head>
<body>
  <div id="bootState">Dashboard wird geladen …</div>
  <iframe id="previewFrame" title="UpperRacing Dashboard Test"></iframe>

  <script>
    (function(){
      const frame=document.getElementById('previewFrame');
      const boot=document.getElementById('bootState');
      const build=Date.now().toString();

      const scripts=[
        '../preview/proxy.js',
        '../preview/preview.js',
        '../preview/parser-prefilter.js',
        '../preview/parser-turn-gap-fix.js',
        '../preview/parser-v4.js',
        '../preview/stardesign-finder.js',
        '../preview/schedule-mobile-ui.js',
        '../preview/day-rollover.js',
        '../preview/header-program-context.js',
        '../preview/weather-warning-test.js',
        '../preview/tire-setup-test.js',
        '../preview/dashboard-ui-v3.js',
        '../preview/dashboard-refine-v4.js'
      ];

      function loadScript(src){
        return new Promise(function(resolve,reject){
          const s=document.createElement('script');
          s.src=src+'?dashboardtest='+build;
          s.async=false;
          s.onload=resolve;
          s.onerror=function(){reject(new Error('Script konnte nicht geladen werden: '+src))};
          document.head.appendChild(s);
        });
      }

      scripts.reduce(function(p,src){return p.then(function(){return loadScript(src)})},Promise.resolve())
        .then(function(){
          return fetch('../app-base.html?dashboardtest='+build,{cache:'no-store'});
        })
        .then(function(res){
          if(!res.ok)throw new Error('HTTP '+res.status);
          return res.text();
        })
        .then(function(html){
          html=html.replace('<head>','<head><base href="/UpperRacing-/">');
          html=html.replace(/(src|href)="(?!https?:|\/\/|data:|#)([^"]+)"/g,function(match,attr,url){
            let clean=url;
            if(clean==='weather.js'||clean==='./weather.js')clean='preview/weather.js';
            const sep=clean.indexOf('?')>=0?'&':'?';
            return attr+'="'+clean+sep+'dashboardtest='+build+'"';
          });
          frame.addEventListener('load',function(){
            if(boot)boot.style.display='none';
          },{once:true});
          frame.srcdoc=html;
        })
        .catch(function(err){
          console.error('[Dashboard Test] Ladefehler:',err);
          if(boot){
            boot.textContent='Ladefehler – bitte Seite neu öffnen';
            boot.style.color='#ff6b5d';
          }
        });
    })();
  </script>
</body>
</html>
