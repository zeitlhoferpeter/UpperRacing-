<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090909">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>UpperRacing Dashboard Test</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#090909;overflow:hidden}
    #previewFrame{display:block;width:100%;height:100%;border:0;background:#121212}
    #bootState{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090909;color:#aaa;font:600 14px system-ui;z-index:10}
    #pullRefresh{position:fixed;left:50%;top:9px;z-index:99999;transform:translate(-50%,-56px);background:#181818;border:1px solid #3d3d3d;border-radius:18px;color:#ddd;font:800 11px system-ui;padding:8px 13px;opacity:0;transition:transform .16s ease,opacity .16s ease;pointer-events:none;box-shadow:0 5px 18px rgba(0,0,0,.35)}
    #pullRefresh.show{opacity:1;transform:translate(-50%,0)}
    #pullRefresh.ready{color:#ffd400;border-color:#756300}
  </style>
</head>
<body>
  <div id="bootState">Dashboard wird geladen …</div>
  <div id="pullRefresh">↓ Zum Aktualisieren ziehen</div>
  <iframe id="previewFrame" title="UpperRacing Dashboard Test"></iframe>

  <script>
    (function(){
      const frame=document.getElementById('previewFrame');
      const boot=document.getElementById('bootState');
      const indicator=document.getElementById('pullRefresh');
      const build='20260817-header-priority3';
      let cupModulePromise=null;
      let cloudModulePromise=null;

      function installPullRefresh(){
        const d=frame.contentDocument;
        if(!d||d.__upperPullRefreshInstalled)return;
        d.__upperPullRefreshInstalled=true;
        let startY=0,dy=0,tracking=false;
        const scrollTop=()=>Math.max(0,(d.scrollingElement&&d.scrollingElement.scrollTop)||d.documentElement.scrollTop||d.body.scrollTop||0);
        d.addEventListener('touchstart',function(e){
          const t=e.target;
          if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"]'))return;
          if(scrollTop()>1)return;
          tracking=true;dy=0;startY=e.touches[0].clientY;
        },{passive:true});
        d.addEventListener('touchmove',function(e){
          if(!tracking)return;
          dy=e.touches[0].clientY-startY;
          if(dy<=8||scrollTop()>1){indicator.classList.remove('show','ready');return}
          indicator.classList.add('show');
          if(dy>=85){indicator.classList.add('ready');indicator.textContent='↻ Loslassen zum Aktualisieren'}
          else{indicator.classList.remove('ready');indicator.textContent='↓ Zum Aktualisieren ziehen'}
        },{passive:true});
        d.addEventListener('touchend',function(){
          if(!tracking)return;
          const reload=dy>=85&&scrollTop()<=1;
          tracking=false;dy=0;
          indicator.classList.remove('show','ready');
          if(reload){indicator.textContent='↻ Aktualisiere …';indicator.classList.add('show','ready');setTimeout(()=>location.reload(),80)}
        },{passive:true});
      }

      function prepareCupButton(){
        const d=frame.contentDocument;if(!d)return;
        const page=d.getElementById('pageCup');if(!page)return;
        const box=page.querySelector('.setup-box');
        const openBtn=page.querySelector('button[onclick*="openCupInBrowser"]');
        const saveBtn=page.querySelector('button[onclick*="saveCupUrl"]');
        const actions=openBtn&&openBtn.parentElement;
        const title=page.querySelector('.setup-box h3');
        const intro=page.querySelector('.setup-box p');
        if(title)title.style.display='none';
        if(intro)intro.style.display='none';
        if(actions){actions.style.display='flex';actions.style.flexDirection='column';actions.style.gap='8px'}
        if(openBtn){
          if(box&&box.firstChild!==openBtn)box.insertBefore(openBtn,box.firstChild);
          openBtn.textContent='🏆 Jahreswertung öffnen ↗';openBtn.style.width='100%';openBtn.style.flex='none';
          openBtn.style.background='#ffd400';openBtn.style.color='#0b0b0b';openBtn.style.fontWeight='900';openBtn.style.fontSize='1rem';
          openBtn.style.padding='15px 12px';openBtn.style.borderRadius='8px';openBtn.style.marginBottom='14px';openBtn.style.border='none';
        }
        if(saveBtn){saveBtn.textContent='Fallback-Link speichern';saveBtn.style.width='100%';saveBtn.style.flex='none';saveBtn.style.background='#2a2a2a';saveBtn.style.color='#aaa';saveBtn.style.fontSize='.78rem';saveBtn.style.padding='9px'}
      }

      function loadCupModule(){
        if(cupModulePromise)return cupModulePromise;
        cupModulePromise=new Promise(function(resolve,reject){
          const s=document.createElement('script');
          s.src='../preview/cup-auto-test.js?dashboardtest='+build;
          s.onload=function(){resolve()};
          s.onerror=function(){cupModulePromise=null;reject(new Error('Cup-Modul konnte nicht geladen werden'))};
          document.head.appendChild(s);
        });
        return cupModulePromise;
      }

      function loadCloudModule(){
        if(cloudModulePromise)return cloudModulePromise;
        cloudModulePromise=new Promise(function(resolve,reject){
          const s=document.createElement('script');
          s.src='../preview/cloud-backup-test.js?dashboardtest='+build;
          s.onload=function(){resolve()};
          s.onerror=function(){cloudModulePromise=null;reject(new Error('Cloud-Modul konnte nicht geladen werden'))};
          document.head.appendChild(s);
        });
        return cloudModulePromise;
      }

      function installLazyFeatures(){
        const w=frame.contentWindow;if(!w||w.__upperLazyFeatures)return;
        w.__upperLazyFeatures=true;
        const original=w.switchPage;
        if(typeof original!=='function')return;
        w.switchPage=function(page){
          const result=original.apply(this,arguments);
          if(page==='cup'){
            prepareCupButton();
            loadCupModule().then(function(){
              if(w.upperCupAutoTest&&typeof w.upperCupAutoTest.activate==='function')w.upperCupAutoTest.activate();
            }).catch(function(err){console.warn('[Cup Lazy]',err)});
          }
          if(page==='backup'){
            loadCloudModule().then(function(){
              if(window.upperCloudBackupTest&&typeof window.upperCloudBackupTest.activate==='function')window.upperCloudBackupTest.activate();
            }).catch(function(err){console.warn('[Cloud Lazy]',err)});
          }
          return result;
        };
      }

      const scripts=[
        '../preview/proxy.js',
        '../preview/preview.js',
        '../preview/parser-prefilter.js',
        '../preview/parser-turn-gap-fix.js',
        '../preview/parser-v4.js',
        '../preview/stardesign-finder.js',
        '../preview/schedule-mobile-ui.js',
        '../preview/day-rollover.js',
        '../preview/header-program-context.js',
        '../preview/weather-warning-test.js',
        '../preview/tire-setup-test.js',
        '../preview/dashboard-ui-v3.js',
        '../preview/dashboard-refine-v4.js',
        '../preview/dashboard-style-v5.js'
      ];

      function fetchText(url){
        return fetch(url,{cache:'default'}).then(function(res){
          if(!res.ok)throw new Error(url+' HTTP '+res.status);
          return res.text();
        });
      }

      function installScripts(texts){
        texts.forEach(function(code,i){
          const s=document.createElement('script');
          s.textContent=code+'\n//# sourceURL='+scripts[i];
          document.head.appendChild(s);
        });
      }

      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistration('/UpperRacing-/').then(function(reg){if(reg)reg.update().catch(()=>{})}).catch(()=>{});
      }

      const scriptPromise=Promise.all(scripts.map(function(src){return fetchText(src+'?dashboardtest='+build)}));
      const appPromise=fetchText('../app-base.html?dashboardtest='+build);

      Promise.all([scriptPromise,appPromise])
        .then(function(result){
          const texts=result[0];let html=result[1];
          installScripts(texts);
          html=html.replace('<head>','<head><base href="/UpperRacing-/">');
          html=html.replace(/(src|href)="(?!https?:|\/\/|data:|#)([^"]+)"/g,function(match,attr,url){
            let clean=url;if(clean==='weather.js'||clean==='./weather.js')clean='preview/weather.js';
            const sep=clean.indexOf('?')>=0?'&':'?';return attr+'="'+clean+sep+'dashboardtest='+build+'"';
          });
          frame.addEventListener('load',function(){
            if(boot)boot.style.display='none';
            installPullRefresh();
            installLazyFeatures();
          },{once:true});
          frame.srcdoc=html;
        })
        .catch(function(err){
          console.error('[Dashboard Test] Ladefehler:',err);
          if(boot){boot.textContent='Ladefehler – bitte Seite neu öffnen';boot.style.color='#ff6b5d'}
        });
    })();
  </script>
</body>
</html>
