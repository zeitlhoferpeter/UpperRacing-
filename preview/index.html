<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090909">
  <title>UpperRacing Preview</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#090909;overflow:hidden}#previewFrame{display:block;width:100%;height:100%;border:0;background:#121212}
  </style>
</head>
<body>
  <iframe id="previewFrame" title="UpperRacing Testversion"></iframe>
  <script>
    (function(){
      const frame=document.getElementById('previewFrame');
      const build=Date.now().toString();
      fetch('../app-base.html?preview=header-v2&pv='+build,{cache:'no-store'})
        .then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.text();})
        .then(function(html){
          html=html.replace('<head>','<head><base href="/UpperRacing-/">');
          html=html.replace(/(src|href)="(?!https?:|\/\/|data:|#)([^"]+)"/g,function(match,attr,url){
            let clean=url;
            if(clean==='weather.js'||clean==='./weather.js') clean='preview/weather.js';
            const sep=clean.indexOf('?')>=0?'&':'?';
            return attr+'="'+clean+sep+'pv='+build+'"';
          });
          frame.srcdoc=html;
        })
        .catch(function(err){
          console.warn('[Preview] Frischer App-Load fehlgeschlagen, Fallback:',err);
          frame.src='../app-base.html?preview=header-v2&pv='+build;
        });
    })();
  </script>
  <script src="proxy.js?v=20260816-2"></script>
  <script src="preview.js?v=20260816-2"></script>
  <script src="parser-prefilter.js?v=20260816-2"></script>
  <script src="parser-turn-gap-fix.js?v=20260816-2"></script>
  <script src="parser-v4.js?v=20260816-2"></script>
  <script src="stardesign-finder.js?v=20260816-2"></script>
  <script src="schedule-mobile-ui.js?v=20260816-2"></script>
  <script src="day-rollover.js?v=20260816-2"></script>
  <script src="header-program-context.js?v=20260816-2"></script>
  <script src="weather-warning-test.js?v=20260816-2"></script>
  <script src="dashboard-ui-v2.js?v=20260816-2"></script>
</body>
</html>
