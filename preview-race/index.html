<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090909">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UpperRacing">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../icon.png">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <title>UpperRacing Race Header Test</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#090909;overflow:hidden}
    #previewFrame{display:block;width:100%;height:100%;border:0;background:#121212;opacity:0;transition:opacity .08s ease}
    #previewFrame.ready{opacity:1}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090909;color:#aaa;font:600 14px system-ui;z-index:10}
  </style>
</head>
<body>
  <div id="boot">Dashboard wird geladen …</div>
  <iframe id="previewFrame" title="UpperRacing Race Header Test"></iframe>
  <script>
    (function(){
      const frame=document.getElementById('previewFrame'),boot=document.getElementById('boot');
      const build='20260826-startup-retry-test1';
      const scripts=[
        '../preview/proxy.js',
        '../preview/preview.js',
        '../preview/parser-prefilter.js',
        '../preview/parser-turn-gap-fix.js',
        '../preview/parser-v4.js',
        '../preview/stardesign-finder.js',
        '../preview/schedule-mobile-ui.js',
        '../preview/day-rollover.js',
        '../preview/header-race-detached-test.js',
        '../preview/tire-setup-test.js',
        '../preview/dashboard-ui-v3.js',
        '../preview/dashboard-refine-v4.js',
        '../preview/dashboard-style-v5.js',
        '../preview/weather-trackday-test.js',
        '../preview/header-frame-clean-test.js',
        '../preview/header-alert-priority-fix-test.js',
        '../preview/cloud-v2-bootstrap-test.js',
        '../preview/cloud-sync-v2-test.js',
        '../preview/header-visibility-guard-test.js',
        '../preview/track-persistence-test.js',
        '../preview/weather-selected-track-init-fix-test.js',
        '../preview/schedule-track-header-only-test.js',
        '../preview/pack-categories-test.js',
        '../preview/dashboard-layout-v6-test.js',
        '../preview/pages-design-unify-test.js',
        '../preview/install-prompt-test.js',
        '../preview/cloud-hint-button-contrast-test.js',
        '../preview/turn-notifications-test.js'
      ];
      const optionalScripts=[
        '../preview/anonymous-usage-test.js'
      ];

      function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

      async function fetchText(url){
        let lastError=null;
        const delays=[0,300,900];
        for(let attempt=0;attempt<delays.length;attempt++){
          if(delays[attempt])await wait(delays[attempt]);
          try{
            const r=await fetch(url,{cache:'no-store'});
            if(!r.ok)throw new Error(url+' HTTP '+r.status);
            return await r.text();
          }catch(err){
            lastError=err;
            console.warn('[UpperRacing Test] Ladeversuch '+(attempt+1)+' fehlgeschlagen:',url,err);
          }
        }
        throw lastError||new Error(url+' konnte nicht geladen werden');
      }

      function installCode(code,source){
        const s=document.createElement('script');
        s.textContent=code+'\n//# sourceURL='+source;
        document.head.appendChild(s);
      }

      function loadOptionalScripts(){
        optionalScripts.forEach(function(src){
          fetchText(src+'?v='+build)
            .then(function(code){installCode(code,src)})
            .catch(function(err){console.warn('[UpperRacing Test] Optionales Modul übersprungen:',src,err)});
        });
      }

      Promise.all([Promise.all(scripts.map(s=>fetchText(s+'?v='+build))),fetchText('../app-base.html?v='+build)])
        .then(([codes,html])=>{
          codes.forEach((code,i)=>{
            if(scripts[i].endsWith('/cloud-sync-v2-test.js')){
              code=code.replace('const AUTOSAVE_DELAY=45000;','const AUTOSAVE_DELAY=900000;')
                       .replace('Autospeichern: ca. 45 Sek. nach Änderungen','Autospeichern: ca. 15 Min. nach Änderungen')
                       .replace("if(currentUser||d.getElementById('ucModal'))return;","if(currentUser||d.getElementById('ucModal'))return;if(document.getElementById('upperInstallPrompt')){setTimeout(function(){maybeHint(w,d)},500);return;}")
                       .replace("if(frame.contentDocument&&frame.contentDocument.readyState==='complete')activate();else frame.addEventListener('load',activate,{once:true});","let activated=false;function activateWhenReady(){const d=frame.contentDocument;if(activated||!d||!d.getElementById('pageBackup'))return;activated=true;activate()}frame.addEventListener('load',activateWhenReady);activateWhenReady();");
            }
            installCode(code,scripts[i]);
          });
          html=html.replace('<head>','<head><base href="/UpperRacing-/"><style id="upperInitialHeaderGuard">.app-header{visibility:hidden!important}</style>');
          html=html.replace(/(src|href)="(?!https?:|\/\/|data:|#)([^"]+)"/g,(m,a,u)=>{let clean=u;if(clean==='weather.js'||clean==='./weather.js')clean='preview/weather.js';return a+'="'+clean+(clean.includes('?')?'&':'?')+'v='+build+'"'});
          frame.addEventListener('load',()=>{
            setTimeout(()=>{
              const d=frame.contentDocument;
              const guard=d&&d.getElementById('upperInitialHeaderGuard');
              if(guard)guard.remove();
              const header=d&&d.querySelector('.app-header');
              if(header)header.style.visibility='visible';
              frame.classList.add('ready');
              boot.style.display='none';
              loadOptionalScripts();
            },180);
          },{once:true});
          frame.srcdoc=html;
        })
        .catch(err=>{console.error('[UpperRacing Test] Ladefehler nach Wiederholungsversuchen:',err);boot.textContent='Ladefehler – bitte Seite neu öffnen';boot.style.color='#ff6b5d'});
    })();
  </script>
</body>
</html>
